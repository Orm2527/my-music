<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Archive</title>
    <!-- 引入 Tailwind CSS 樣式庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('1127.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- 頂部標題、搜尋與分類區（單排、靠右對齊） -->
    <div class="max-w-md md:max-w-lg lg:max-w-xl mx-auto md:ml-auto md:mr-12 w-full p-4">
        <h1 class="text-3xl font-bold text-purple-300 mb-1">LingOrm Music Archive</h1>
        <p class="text-sm text-white mb-4">LingOrm音樂收藏庫 感謝dek_duu_sha提供音檔</p>
        
        <!-- 專輯 / 分類標籤切換按鈕 -->
        <div id="categoryTabs" class="flex flex-wrap gap-2 mb-4">
            <!-- 動態產生分類標籤 -->
        </div>

        <!-- 搜尋列 -->
        <input type="text" id="searchInput" placeholder="搜尋歌曲、歌手..." class="w-full p-3 rounded-xl border border-purple-200/50 bg-white/35 backdrop-blur-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-400 mb-4 placeholder-gray-700">
        
        <!-- 歌曲清單（單排） -->
        <div id="songList" class="flex flex-col gap-3 mb-36">
            <!-- 歌曲會透過 JavaScript 動態載入這裡 -->
        </div>
    </div>

    <!-- 底部音樂播放器 -->
    <div id="playerBar" class="fixed bottom-0 left-0 right-0 bg-purple-900/95 backdrop-blur-md text-white p-4 shadow-2xl border-t border-purple-700 hidden">
        <div class="max-w-md md:max-w-3xl lg:max-w-4xl mx-auto">
            <!-- 歌曲進度條 -->
            <div class="w-full mb-2">
                <input type="range" id="progressBar" value="0" max="100" class="w-full accent-purple-300 cursor-pointer">
                <div class="flex justify-between text-xs text-purple-300">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="flex flex-col md:flex-row items-center justify-between gap-3">
                <div class="w-full md:w-auto text-center md:text-left">
                    <div id="playerTitle" class="font-bold text-sm truncate max-w-xs">歌曲名稱</div>
                    <div id="playerArtist" class="text-xs text-purple-300 truncate max-w-xs">歌手</div>
                </div>

                <!-- 控制按鈕群組 -->
                <div class="flex items-center space-x-2">
                    <button id="prevBtn" class="bg-purple-700 hover:bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-bold transition">⏮ 上一首</button>
                    <button onclick="togglePlay()" id="playBtn" class="bg-purple-300 text-purple-950 hover:bg-purple-200 px-4 py-2 rounded-lg text-sm font-bold transition">⏸ 暫停</button>
                    <button id="nextBtn" class="bg-purple-700 hover:bg-purple-600 text-white px-3 py-2 rounded-lg text-sm font-bold transition">下一首 ⏭</button>
                </div>

                <!-- 音量控制 -->
                <div class="flex items-center space-x-2 text-xs text-purple-300">
                    <span>🔊</span>
                    <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="1" class="w-20 accent-purple-300 cursor-pointer">
                </div>
            </div>
        </div>
        <audio id="audioElement"></audio>
    </div>

    <script>
        const songs = [
            { title: "01.Dracula", artist: "LingOrm", url: "01.Dracula.mp3", category: "LingOrm Between us" },
            { title: "02.Rockstar", artist: "LingOrm", url: "02.Rockstar.mp3", category: "LingOrm Between us" },
            { title: "03.BadAngel", artist: "LingOrm", url: "03.BadAngel.mp3", category: "LingOrm Between us" },
            { title: "04.heaven7", artist: "LingOrm", url: "04.heaven7.mp3", category: "LingOrm Between us" },
            { title: "05.LoveOnTop", artist: "LingLing Kwong", url: "05.LoveOnTop.mp3", category: "LingOrm Between us" },
            { title: "06.OnePunch", artist: "Orm Kornnaphat", url: "06.OnePunch.mp3", category: "LingOrm Between us" },
            { title: "07.NOW", artist: "Orm x Gel Boys", url: "07.NOW.mp3", category: "LingOrm Between us" },
            { title: "09.Until I Found You", artist: "LingLing Kwong", url: "09.Until I Found You.mp3", category: "LingOrm Between us" },
            { title: "10.L-O-V-E", artist: "LingLing Kwong", url: "10.L-O-V-E.mp3", category: "LingOrm Between us" },
            { title: "11. Risk it all", artist: "Orm Kornnaphat", url: "11. Risk it all.mp3", category: "LingOrm Between us" },
            { title: "12. ขี้แง(Boys Don’t Cry)", artist: "LingOrm", url: "12. ขี้แง(Boys Don’t Cry).mp3", category: "LingOrm Between us" },
            { title: "13. Magnetic", artist: "LingOrm LOLO ButterBear", url: "13. Magnetic.mp3", category: "LingOrm Between us" },
            { title: "15. หล่ออนิเมะ", artist: "LingOrm", url: "15. หล่ออนิเมะ.mp3", category: "LingOrm Between us" },
            { title: "16. Nobody", artist: "Ling x Oat x Pop", url: "16. Nobody.mp3", category: "LingOrm Between us" },
            { title: "18. สวยเด้งดิ้ง", artist: "LingLing Kwong", url: "18. สวยเด้งดิ้ง.mp3", category: "LingOrm Between us" },
            { title: "19. T2T", artist: "LingOrm", url: "19. T2T.mp3", category: "LingOrm Between us" },
            { title: "20. Sports Car", artist: "Orm Kornnaphat", url: "20. Sports Car.mp3", category: "LingOrm Between us" },
            { title: "21. หวานใจผมน่ารักกว่าใคร", artist: "LingOrm", url: "21. หวานใจผมน่ารักกว่าใคร.mp3", category: "LingOrm Between us" },
            { title: "22. เจ็บนิดๆ", artist: "LingOrm x Bow", url: "22. เจ็บนิดๆ.mp3", category: "LingOrm Between us" },
            { title: "23. เกินต้าน (Too Cute)", artist: "Bow", url: "23. เกินต้าน (Too Cute).mp3", category: "LingOrm Between us" },
            { title: "24. Love Shot", artist: "LingOrm", url: "24. Love Shot.mp3", category: "LingOrm Between us" },
            { title: "25. Ma Boy", artist: "LingOrm", url: "25. Ma Boy.mp3", category: "LingOrm Between us" },
            { title: "26. ล็อกเป้า (Lock Pao)", artist: "LingOrm", url: "26. ล็อกเป้า (Lock Pao).mp3", category: "LingOrm Between us" },
            { title: "27. I Am The Best", artist: "LingOrm", url: "27. I Am The Best.mp3", category: "LingOrm Between us" },
            { title: "28. Touch", artist: "LingOrm", url: "28. Touch.mp3", category: "LingOrm Between us" },
            { title: "29. การเดินทางที่สวยงาม", artist: "LingOrm", url: "29. การเดินทางที่สวยงาม.mp3", category: "LingOrm Between us" },
            { title: "30. Rocket Festival(สัญญาเดือนหก)", artist: "LingOrm", url: "30. Rocket Festival(สัญญาเดือนหก).mp3", category: "LingOrm Between us" },
            { title: "31. โอ้ละหนอ…My Love", artist: "LingOrm", url: "31. โอ้ละหนอ…My Love.mp3", category: "LingOrm Between us" },
            { title: "32. เด็กดอยใจดี", artist: "LingOrm", url: "32. เด็กดอยใจดี.mp3", category: "LingOrm Between us" },
            { title: "33.ไม่ได้ก็ไม่เอา (YOU ARE MY LIGHT)", artist: "Ling x PP", url: "33.ไม่ได้ก็ไม่เอา (YOU ARE MY LIGHT).mp3", category: "LingOrm Between us" },
            { title: "34.FLY ME TO THE MOON CAN'T TAKE MY EYES OFF YOU", artist: "LingLing Kwong", url: "34.FLY ME TO THE MOON CAN'T TAKE MY EYES OFF YOU.mp3", category: "LingOrm Between us" },
            { title: "35.G.A.Y", artist: "Orm Kornnaphat", url: "35.G.A.Y.mp3", category: "LingOrm Between us" },
            { title: "36.GO GO JUICE", artist: "Orm Kornnaphat", url: "36.GO GO JUICE.mp3", category: "LingOrm Between us" },
	    { title: "Standing Next to You", artist: "LingOrm", url: "Standing Next to You.mp3", category: "Other" },
	    { title: "pinky up", artist: "Orm Kornnaphat", url: "pinky up.mp3", category: "Other" },
     	    { title: "My name is Lo Lo", artist: "LOLO", url: "My name is Lo Lo.mp3", category: "Other" },
	    { title: "let's go", artist: "LingLing Kwong", url: "let's go.mp3", category: "Other" },
	    { title: "Forever", artist: "LingOrm", url: "Forever.mp3", category: "Other" },
	    { title: "โสดกะปริบกะปรอย", artist: "LingOrm", url: "โสดกะปริบกะปรอย.mp3", category: "Other" },
	    { title: "ถ้าตลอดกาลมีจริง", artist: "LingOrm", url: "ถ้าตลอดกาลมีจริง.mp3", category: "Other" },
	    { title: "ละลาย (LALALYE)", artist: "Orm Kornnaphat", url: "ละลาย (LALALYE).mp3", category: "Other" },
	    { title: "ฝน ธนสุนทร (Isan Girl Waiting for Love)", artist: "LingLing Kwong", url: "ฝน ธนสุนทร (Isan Girl Waiting for Love).mp3", category: "Other" },
	    { title: "กุหลาบ (KULARB)", artist: "LingOrm", url: "กุหลาบ (KULARB) ft. Gulf.mp3", category: "Other" },
	    { title: "DEJAYOU", artist: "LingOrm", url: "DEJAYOU.mp3", category: "Other" },
	    { title: "Dance the Night", artist: "LingOrm", url: "Dance the Night.mp3", category: "Other" },
	    
        ];

        let currentSongIndex = 0;
        let currentCategory = '全部';
// 設定預設音量為 30%
document.addEventListener('DOMContentLoaded', () => {
    audioElement.volume = 0.3;
    volumeBar.value = 0.3;
});

        const songListEl = document.getElementById('songList');
        const categoryTabsEl = document.getElementById('categoryTabs');
        const playerBar = document.getElementById('playerBar');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const audioElement = document.getElementById('audioElement');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const volumeBar = document.getElementById('volumeBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const searchInput = document.getElementById('searchInput');

        // 渲染分類按鈕
        function renderCategories() {
            const predefinedCategories = ['全部', 'LingOrm Between us', 'Other'];
            const dynamicCategories = [...new Set(songs.map(s => s.category))];
            const categories = [...new Set([...predefinedCategories, ...dynamicCategories])];
            
            categoryTabsEl.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = currentCategory === cat;
                btn.className = isActive 
                    ? "bg-purple-800 text-white px-4 py-2 rounded-xl text-sm font-bold shadow transition"
                    : "bg-white/35 hover:bg-white/60 text-purple-950 px-4 py-2 rounded-xl text-sm font-semibold backdrop-blur-sm transition";
                btn.innerText = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    searchInput.value = ''; 
                    renderCategories();
                    renderSongs();
                };
                categoryTabsEl.appendChild(btn);
            });
        }

        // 渲染歌曲列表
        function renderSongs() {
            songListEl.innerHTML = '';
            const keyword = searchInput.value.toLowerCase();

            const filteredSongs = songs.filter(song => {
                const matchCategory = currentCategory === '全部' || song.category === currentCategory;
                const matchKeyword = song.title.toLowerCase().includes(keyword) || song.artist.toLowerCase().includes(keyword);
                return matchCategory && matchKeyword;
            });

            if (filteredSongs.length === 0) {
                songListEl.innerHTML = `<div class="text-center py-8 text-purple-950/80 font-medium bg-white/20 backdrop-blur-sm rounded-xl">這個分類目前還沒有歌曲喔！</div>`;
                return;
            }

            filteredSongs.forEach((song) => {
                const originalIndex = songs.findIndex(s => s.url === song.url);
                const card = document.createElement('div');
                
                if (currentSongIndex === originalIndex) {
                    card.className = "bg-purple-100/40 backdrop-blur-sm p-3.5 rounded-xl shadow-md border-2 border-purple-500/80 cursor-pointer transition transform hover:scale-[1.01]";
                } else {
                    card.className = "bg-white/10 backdrop-blur-sm p-3.5 rounded-xl shadow-sm cursor-pointer hover:bg-white/30 transition transform hover:scale-[1.01]";
                }

                card.innerHTML = `
                    <div class="flex items-center justify-between px-2">
                        <div class="overflow-hidden flex-1 pr-3">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[10px] bg-purple-200/60 text-purple-900 px-2 py-0.5 rounded font-bold">${song.category}</span>
                            </div>
                            <h3 class="font-bold text-white truncate text-base">${song.title}</h3>
                            <p class="text-xs text-gray-700 truncate">${song.artist}</p>
                        </div>
                        <span class="bg-purple-200/70 hover:bg-purple-300 text-purple-950 px-5 py-2 rounded-lg text-xs font-bold shrink-0 shadow-sm">${currentSongIndex === originalIndex ? '♪ PLAYING' : 'PLAY'}</span>
                    </div>
                `;
                card.onclick = () => {
                    playSong(originalIndex);
                };
                songListEl.appendChild(card);
            });
        }

        // 播放音樂
        function playSong(index) {
            currentSongIndex = index;
            const song = songs[index];
            playerTitle.innerText = song.title;
            playerArtist.innerText = song.artist;
            audioElement.src = song.url;
            audioElement.play();
            playerBar.classList.remove('hidden');
            playBtn.innerText = '⏸ 暫停';

            renderSongs();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: "LingOrm Music Archive"
                });

                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
            }
        }

        // 播放/暫停切換
        function togglePlay() {
            if (audioElement.paused) {
                audioElement.play();
                playBtn.innerText = '⏸ 暫停';
            } else {
                audioElement.pause();
                playBtn.innerText = '▶ 播放';
            }
            renderSongs();
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            playSong(currentSongIndex);
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            playSong(currentSongIndex);
        }

        document.getElementById('prevBtn').addEventListener('click', prevSong);
        document.getElementById('nextBtn').addEventListener('click', nextSong);
        audioElement.addEventListener('ended', nextSong);

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
        }

        audioElement.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioElement.duration);
            progressBar.max = audioElement.duration;
        });

        audioElement.addEventListener('timeupdate', () => {
            progressBar.value = audioElement.currentTime;
            currentTimeEl.textContent = formatTime(audioElement.currentTime);
        });

        progressBar.addEventListener('input', () => {
            audioElement.currentTime = progressBar.value;
        });

        volumeBar.addEventListener('input', () => {
            audioElement.volume = volumeBar.value;
        });

        searchInput.addEventListener('input', () => {
            renderSongs();
        });

        // 初始化載入
        renderCategories();
        renderSongs();
    </script>
</body>
</html>
